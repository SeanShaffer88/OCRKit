# CI for OCRKit — canonical WinDevKit workflow, adapted. Copy to
# .github/workflows/ci.yml. NOTE: the GitHub App cannot create/edit
# files under .github/workflows/ (no Workflows permission), so this
# file is always added through the GitHub web UI.
#
# Two adaptations from the canonical cargo-only workflow, both forced
# by the vendored engine stack:
#   1. A fetch step downloads the pinned engine sources (zlib, libpng,
#      Leptonica, Tesseract) and the eng test tessdata (SHA-256
#      verified against pins.txt) — the build has an engine only when
#      vendor/src-* exists. On the Windows runner the fetch runs
#      through fetch.ps1 (PowerShell is the default shell); fetch.sh
#      is the POSIX twin (`sh ./fetch.sh`).
#   2. An explicitly-labeled e2e step runs the real OCR proof: the
#      committed fixture image (rendered text: "The quick brown fox
#      jumps over the lazy dog 12345") recognized with the pinned
#      eng.traineddata. This is the step that proves the Windows/MSVC
#      build + link of the whole engine stack AND native OCR.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fetch pinned engine sources + test tessdata (SHA-256 verified)
        run: ./fetch.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: E2E OCR proof (real engine stack, pinned eng tessdata, rendered-text fixture)
        env:
          OK_E2E: "1"
          OK_TESSDATA: vendor/tessdata
        run: cargo test --locked --test e2e -- --ignored --nocapture
      - run: cargo build --release --locked
