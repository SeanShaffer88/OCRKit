[package]
name = "ocrkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Sean Shaffer"]
description = "Offline OCR behind one clean C ABI: Tesseract + Leptonica (pinned, vendored, hash-verified) returning JSON text + confidence"
license = "MIT"
repository = "https://github.com/SeanShaffer88/OCRKit"
keywords = ["windows", "ffi", "ocr", "tesseract"]
categories = ["os::windows-apis", "api-bindings", "multimedia::images"]

[lib]
name = "ocrkit"
crate-type = ["cdylib", "rlib", "staticlib"]

# The Rust side is zero-dependency by design (house rule). The external
# components are the OCR engine stack itself — Tesseract, Leptonica,
# libpng, zlib: never committed, pinned in pins.txt, fetched +
# SHA-256-verified by fetch.sh / fetch.ps1 into vendor/ (gitignored),
# built as static libraries by build.rs via CMake. Without the vendored
# sources the crate still builds and unit-tests; the engine entry
# points then report OK_ERR_NOT_SUPPORTED. See THIRD-PARTY-NOTICES.md.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Deliberately NOT panic = "abort": every FFI entry point guards with
# catch_unwind, and the guard is the host app's protection — it only
# works when panics unwind to the boundary.
